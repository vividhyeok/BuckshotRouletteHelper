<!DOCTYPE html>
<html lang="en" data-theme="">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Buckshot Roulette Helper | Buckshot Tracker</title>
<meta name="application-name" content="Buckshot Roulette Helper" />
<meta name="description" content="Buckshot Roulette Helper is a lightweight tracker web app for Buckshot Roulette players to log real shells and blanks visually in real time." />
<meta name="keywords" content="Buckshot Roulette,Buckshot Roulette Helper,Buckshot Roulette tracker,shotgun roulette helper,indie horror game" />
<meta property="og:title" content="Buckshot Roulette Helper" />
<meta property="og:description" content="Track Buckshot Roulette shells and blanks instantly with the Buckshot Roulette Helper web app." />
<meta property="og:type" content="website" />
<meta property="og:locale" content="en_US" />
<meta name="twitter:card" content="summary" />
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5832948864230013" crossorigin="anonymous"></script>
<style>
  :root{
    --bg:#0e0f12; --fg:#e6e6e6; --muted:#6b7280;
    --red:#ef4444; --blue:#3b82f6; --grey:#9aa0a6;
    --cell:42px; --gap:6px; --rail:160px;
    --border:#23262b; --panel:#14161a; --tile:#13161a; --tileBorder:#1f232a;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f7f7f8; --fg:#121212; --muted:#6b6b6b; --panel:#ffffff; --tile:#f3f4f6; --tileBorder:#d1d5db; --border:#e5e7eb; }
  }
  [data-theme="dark"]  { --bg:#0e0f12; --fg:#e6e6e6; --muted:#6b7280; --panel:#14161a; --tile:#13161a; --tileBorder:#1f232a; --border:#23262b; }
  [data-theme="light"] { --bg:#f7f7f8; --fg:#121212; --muted:#6b6b6b; --panel:#ffffff; --tile:#f3f4f6; --tileBorder:#d1d5db; --border:#e5e7eb; }

  html,body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,Segoe UI,Roboto,Apple SD Gothic Neo,Apple Color Emoji,Noto Color Emoji;}
  .page{display:flex;justify-content:center;min-height:100dvh}
  /* rails appear on desktop */
  .rail{display:none}
  @media (min-width: 980px){
    .page{padding:0 12px}
    .rail{display:block; width:var(--rail); flex:0 0 var(--rail); position:sticky; top:12px; height:calc(100dvh - 24px)}
  }

  .wrap{flex:1; max-width:820px; padding:8px 12px 88px; position:relative}
  .toolbar{display:flex; gap:8px; justify-content:flex-end; align-items:center; height:40px}
  .iconbtn, .select{
    background:transparent; color:var(--fg); border:1px solid color-mix(in oklab, var(--fg) 24%, transparent);
    border-radius:10px; padding:6px 10px; cursor:pointer; font-size:12px; height:30px
  }
  .iconbtn:disabled{opacity:.35; cursor:not-allowed}
  .select{appearance:none}
  .title{display:none}

  /* modal */
  .modal{position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,.55); z-index:30}
  .card{background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:16px; min-width:280px; max-width:360px; box-shadow:0 10px 30px rgba(0,0,0,.35)}
  .row{display:flex; gap:8px}
  .row input{flex:1; background:var(--tile); color:var(--fg); border:1px solid var(--border); border-radius:8px; padding:10px; font-size:14px}
  .btn{width:100%; margin-top:10px; padding:10px; border:none; border-radius:10px; background:#2b3038; color:#fff; font-size:14px; cursor:pointer}
  .btn:active{transform:translateY(1px)}
  .hint{font-size:12px; color:var(--muted); margin-top:6px}

  /* grid */
  .tracker{display:flex; flex-direction:column; gap:12px; margin-top:10px}
  .grid{overflow-x:auto}
  table{border-collapse:separate; border-spacing:var(--gap); margin:0 auto}
  th,td{width:var(--cell); height:var(--cell); text-align:center; vertical-align:middle; border:1px solid var(--tileBorder); border-radius:8px; background:var(--tile)}
  th{color:var(--muted)}
  .num{font-size:12px}
  /* remaining counters above the table (centered) */
  .remain{display:flex; justify-content:center; gap:14px; align-items:center; font-family:ui-monospace,Menlo,Consolas,monospace; margin:0 0 8px; width:100%;}
  .remain span{font-size:28px}
  .remain .r{color:var(--red)}
  .remain .f{color:var(--blue)}
  .mark{font-size:18px; line-height:1}
  .mark.red{color:var(--red)}
  .mark.blue{color:var(--blue)}
  .btnsq{width:100%; height:100%; border:none; border-radius:6px; cursor:pointer}
  .btnsq.red{background:var(--red)}
  .btnsq.blue{background:var(--blue)}
  .btnsq:active{transform:scale(.98)}

  /* counters as numbers only (no labels) */
  .summary{margin:0; display:flex; flex-direction:column; align-items:flex-end; gap:4px; font-family:ui-monospace,Menlo,Consolas,monospace}
  .sumRow{font-size:14px}
  .sumRow .left{color:var(--grey)}  /* confirmed */
  .sumRow .right{margin-left:4px}
  .sumRow.real .right{color:var(--red)}
  .sumRow.fake .right{color:var(--blue)}

  /* ads */
  .ad-rail, .ad-hz{display:flex; align-items:center; justify-content:center; border:1px dashed var(--tileBorder); background:transparent; color:var(--muted)}
  .ad-rail{width:100%; height:100%; border-radius:12px}
  .ad-hz{width:100%; height:80px; border-radius:12px; margin:10px 0}
  @media (min-width: 420px){ .ad-hz{height:100px} }
  /* reserve space to avoid CLS even before ad loads */

  .bottomBar{position:fixed; left:0; right:0; bottom:0; padding:12px; background:linear-gradient(180deg,transparent,rgba(0,0,0,.55) 30%, rgba(0,0,0,.88)); display:flex; justify-content:center; z-index:20}
  .reset{width:56px; height:56px; border-radius:50%; border:none; background:#22272f; color:#fff; cursor:pointer; font-size:22px}
  .sr-only{position:absolute; left:-9999px; width:1px; height:1px; overflow:hidden}
</style>
</head>
<body>
<div class="page">
  <!-- Left rail ad (desktop only) -->
  <aside class="rail"><div class="ad-rail" id="adLeft">AD</div></aside>

  <main class="wrap">
    <div class="toolbar">
      <button id="undoBtn" class="iconbtn" type="button" title="Undo" aria-label="Undo">↶</button>
      <button id="redoBtn" class="iconbtn" type="button" title="Redo" aria-label="Redo">↷</button>
      <select id="langSel" class="select" aria-label="language">
        <option value="en">EN</option>
        <option value="ko">KO</option>
      </select>
      <button id="themeToggle" class="iconbtn" title="Theme">☾</button>
    </div>

    <h1 class="title" id="title"></h1>
    <div id="status" class="sr-only" aria-live="polite"></div>

    <!-- horizontal ad above grid+summary cluster -->
    <div class="ad-hz" id="adTop">AD</div>

    <div class="tracker" id="tracker">
      <div class="grid" id="grid"></div>

      <!-- numeric-only summaries -->
      <div class="summary" id="summary">
        <!-- e.g., <div class="sumRow real"><span class="left">2</span>/<span class="right">3</span></div> -->
        <!--       <div class="sumRow fake"><span class="left">4</span>/<span class="right">5</span></div> -->
      </div>
    </div>

    <!-- horizontal ad below grid+summary cluster -->
    <div class="ad-hz" id="adBottom">AD</div>

    <p class="sr-only" id="seoDescription">Buckshot Roulette Helper is an offline-ready Buckshot Roulette tracker for recording live shells and blanks with instant visual feedback.</p>
  </main>

  <!-- Right rail ad (desktop only) -->
  <aside class="rail"><div class="ad-rail" id="adRight">AD</div></aside>
</div>

<div class="bottomBar">
  <button class="reset" id="resetBtn" title="reset" aria-label="reset">⟲</button>
</div>

<!-- INPUT MODAL (texts only here; UI elsewhere is symbols/numbers) -->
<div class="modal" id="modal">
  <div class="card">
    <h2 id="mTitle" style="margin:0 0 8px 0;font-size:16px"></h2>
    <div class="row"><input id="pair" inputmode="numeric" placeholder="" /></div>
    <div class="hint" id="hint"></div>
    <button class="btn" id="startBtn"></button>
  </div>
</div>

<script>
/* i18n */
const fallbackDict = {
  en:{ title:"Buckshot Roulette Helper", inputHint:"Format: Live round sum, Blank round sum (e.g., 6,2; max 8 total)", confirm:"Start", resetConfirm:"Start a new game?", invalid:"Invalid input. Sum must be 1~8 using non-negative integers." },
  ko:{ title:"벅샷 룰렛 도우미",   inputHint:"형식: 실탄 수, 공포탄 수 (예: 6,2; 총합 최대 8)",             confirm:"시작",   resetConfirm:"새 게임을 시작할까요?",        invalid:"입력이 올바르지 않습니다. 총합은 1~8, 음수가 아닌 정수를 사용하세요." }
};
const translations = JSON.parse(JSON.stringify(fallbackDict));
const loadedLangs = new Set();
const LS_STATE="buckshot.v1.state";
const LS_LANG ="buckshot.v1.lang";
const LS_THEME="buckshot.v1.theme";

/* elements */
const $ = s=>document.querySelector(s);
const elGrid   = $("#grid");
const elModal  = $("#modal");
const elPair   = $("#pair");
const elStart  = $("#startBtn");
const elLang   = $("#langSel");
const elTitle  = $("#title");
const elHint   = $("#hint");
const elMTitle = $("#mTitle");
const elSummary= $("#summary");
const elReset  = $("#resetBtn");
const elThemeT = $("#themeToggle");
const elUndo   = $("#undoBtn");
const elRedo   = $("#redoBtn");

let lang = localStorage.getItem(LS_LANG) || "en";
let state = null;
let history = [];
let future  = [];

function t(k){ return (translations[lang]||translations.en)[k]; }
function applyLang(){
  elLang.value = lang;
  elMTitle.textContent = t("title");
  elHint.textContent   = t("inputHint");
  elStart.textContent  = t("confirm");
  elTitle.textContent  = t("title");
  elPair.placeholder   = t("inputHint");
}
function ensureLangLoaded(l){
  if(loadedLangs.has(l)) return;
  loadedLangs.add(l);
  fetch(`./i18n/${l}.json`, {cache:"no-store"})
    .then(res=>res.ok?res.json():Promise.reject(res.status))
    .then(data=>{ translations[l] = {...fallbackDict[l], ...data}; if(lang===l) applyLang(); })
    .catch(err=>console.warn("i18n load failed", l, err));
}
function setLang(l){
  lang = l; localStorage.setItem(LS_LANG, lang);
  applyLang();
  ensureLangLoaded(l);
}

ensureLangLoaded("en");
ensureLangLoaded("ko");

function updateNavButtons(){
  if(!elUndo || !elRedo){ return; }
  const hasState = !!state;
  elUndo.disabled = !(hasState && history.length);
  elRedo.disabled = !(hasState && future.length);
}

function pushHistory(){
  if(!state) return;
  history.push([...state.slots]);
  if(history.length>100) history.shift();
  future = [];
  updateNavButtons();
}

function undo(){
  if(!state || !history.length) return;
  future.push([...state.slots]);
  if(future.length>100) future.shift();
  const prev = history.pop();
  state.slots = [...prev];
  save(); render();
}

function redo(){
  if(!state || !future.length) return;
  history.push([...state.slots]);
  if(history.length>100) history.shift();
  const next = future.pop();
  state.slots = [...next];
  save(); render();
}

/* theme */
function resolveTheme(){
  const saved = localStorage.getItem(LS_THEME);
  if(saved==="dark" || saved==="light") return saved;
  return matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}
function applyTheme(theme){
  document.documentElement.setAttribute("data-theme", theme);
  elThemeT.textContent = theme === "dark" ? "☀" : "☾";
}
(function initTheme(){
  applyTheme(resolveTheme());
})();
elThemeT.addEventListener("click", ()=>{
  const cur = resolveTheme();
  const next = (cur==="dark"?"light":"dark");
  applyTheme(next);
  localStorage.setItem(LS_THEME, next);
});

/* state */
function save(){ localStorage.setItem(LS_STATE, JSON.stringify(state)); }
function load(){ try{ return JSON.parse(localStorage.getItem(LS_STATE)); }catch{ return null; } }

/* modal */
function showModal(v){ elModal.style.display = v ? "flex" : "none"; }
function initFromInput(){
  const parts = (elPair.value||"").split(",").map(v=>parseInt(v.trim(),10));
  const real = parts[0], fake = parts[1];
  const total = (Number.isInteger(real)?real:NaN) + (Number.isInteger(fake)?fake:NaN);
  const ok = Number.isInteger(real) && Number.isInteger(fake) && real>=0 && fake>=0 && total>=1 && total<=8;
  if(!ok) return alert(t("invalid"));
  state = { lang, real, fake, slots: Array(real+fake).fill(null) };
  history = [];
  future = [];
  save(); render(); showModal(false);
}

/* render */
function render(){
  setLang(state?.lang || lang);

  if(!state){
    elGrid.innerHTML = "";
    elSummary.innerHTML = "";
    elSummary.style.display = "";
    showModal(true);
    updateNavButtons();
    return;
  }

  // table
  const n = state.slots.length;
  const cReal = state.slots.filter(x=>x==='real').length;
  const cFake = state.slots.filter(x=>x==='fake').length;
  const remReal = Math.max(0, state.real - cReal);
  const remFake = Math.max(0, state.fake - cFake);
  const head = Array.from({length:n}, (_,i)=>`<th class="num">${i+1}</th>`).join("");
  const marks= state.slots.map(x=>{
    if(x==="real")  return `<td><span class="mark red">O</span></td>`;
    if(x==="fake")  return `<td><span class="mark blue">X</span></td>`;
    return `<td></td>`; // 미정은 빈칸
  }).join("");
  const btnR = state.slots.map((v,i)=>{
    const show = (v==='real') || (remReal>0);
    return `<td>${ show ? `<button class="btnsq red" aria-label="real" onclick="setSlot(${i},'real')"></button>` : `` }</td>`;
  }).join("");
  const btnF = state.slots.map((v,i)=>{
    const show = (v==='fake') || (remFake>0);
    return `<td>${ show ? `<button class="btnsq blue" aria-label="fake" onclick="setSlot(${i},'fake')"></button>` : `` }</td>`;
  }).join("");

  elGrid.innerHTML = `
    <div class="remain"><span class="r">${remReal}</span><span class="f">${remFake}</span></div>
    <table>
      <tr>${head}</tr>
      <tr>${marks}</tr>
      <tr>${btnR}</tr>
      <tr>${btnF}</tr>
    </table>
  `;

  // hide old numeric summary block for this new UX
  elSummary.innerHTML = "";
  elSummary.style.display = "none";

  // a11y live
  $("#status").textContent = `real ${cReal}/${state.real}, fake ${cFake}/${state.fake}`;
  updateNavButtons();
}

window.setSlot = (i, type)=>{
  if(!state) return;
  const next = (state.slots[i]===type) ? null : type;
  if(state.slots[i] === next) return;
  pushHistory();
  state.slots[i] = next;
  state.lang = lang;
  save(); render();
};

function resetAll(){
  if(confirm(t("resetConfirm"))){
    localStorage.removeItem(LS_STATE);
    state=null; history=[]; future=[];
    render();
  }
}

/* wire */
elStart.addEventListener("click", initFromInput);
elReset.addEventListener("click", resetAll);
elPair.addEventListener("keydown", e=>{ if(e.key==="Enter") initFromInput(); });
if(elUndo) elUndo.addEventListener("click", undo);
if(elRedo) elRedo.addEventListener("click", redo);
elLang.addEventListener("change", e=>{
  setLang(e.target.value);
  if(state){ state.lang = lang; save(); }
});

/* boot */
state = load(); if(state){ lang = state.lang || lang; }
setLang(lang);
render();
if(!state){ showModal(true); setTimeout(()=>elPair?.focus(), 0); }
</script>
</body>
</html>
